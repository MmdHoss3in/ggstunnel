name: Pre-publication full validation
on:
  push:
    branches: [fix/bip-silent-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    if: contains(github.event.head_commit.message, '[compatibility]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build exact runtime and test mixed published versions
        run: |
          bash scripts/build-release.sh
          python3 -m py_compile scripts/cloud_extended.py scripts/cloud_summary.py
          sudo apt-get update -qq
          sudo apt-get install -y iperf3 ethtool iptables
          sudo env GITHUB_ACTIONS=true python3 scripts/cloud_extended.py compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-compatibility
          path: extended-results/
  extended:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cloud-matrix]')
    uses: ./.github/workflows/extended.yml
