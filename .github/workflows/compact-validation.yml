name: Transport IO and compact wire validation
on:
  push:
    branches: [feature/compact-wire]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: compact-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: |
          mkdir -p formatting
          gofmt -w cmd internal
          git diff --binary -- cmd internal > formatting/gofmt.patch
          cat formatting/gofmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: transport-source-formatting
          path: formatting/gofmt.patch
  regression:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Format in cloud and retain patch
        run: |
          mkdir -p transport-artifacts
          gofmt -w cmd internal
          git diff --binary -- cmd internal > transport-artifacts/gofmt.patch
      - name: Static and race checks
        run: |
          go vet ./...
          python3 -m py_compile scripts/control_path_validation.py scripts/render_release_notes.py
          go test -race -tags audit -short -count=1 -timeout 5m ./... | tee transport-artifacts/race.log
          go test -race ./internal/carrier ./internal/session -run 'Test(BIPHandshake|BIPActor|Reusable|UDPConcurrent|TCPShutdown|ACKPiggyback)' -count=10 -timeout 2m -v | tee transport-artifacts/regression.log
          go test -race ./internal/carrier ./internal/frame -run 'TestCompact' -count=3 -timeout 2m -v | tee transport-artifacts/compact.log
          go test -race ./internal/carrier -run 'Test(FASTLostProbe|BlockedRequestSACK|RequestCarrierProof|DiagnosticLossTrace|TimedSACK)' -count=50 -timeout 2m -v | tee transport-artifacts/retry-path.log
          go test -race ./internal/carrier -run '^TestReplyControl' -count=10 -timeout 3m -v | tee transport-artifacts/reply-control.log
          go test ./internal/carrier -run '^$' -fuzz '^FuzzCompactWireParser$' -fuzztime 500000x -fuzzminimizetime 1000x -timeout 2m
          go test ./internal/carrier -run '^$' -fuzz '^FuzzCompactAuthenticatedBounds$' -fuzztime 100000x -fuzzminimizetime 1000x -timeout 2m
          go test ./internal/frame -run '^$' -fuzz '^FuzzCompactFrameBounds$' -fuzztime 2000000x -fuzzminimizetime 1000x -timeout 2m
      - name: Build and manager checks
        run: |
          bash scripts/build-release.sh
          bash -n setup.sh install.sh scripts/build-release.sh
          python3 scripts/check_version.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Native socket lifecycle
        run: |
          go test -race -c -o /tmp/ggs-carrier.test ./internal/carrier
          sudo env GGS_KERNEL_TEST=1 /tmp/ggs-carrier.test -test.run '^(TestRawCarrierConcurrentStartClose|TestBIPRawLoopback|TestBIPCompactRawLoopback)$' -test.v
      - name: Real TUN payload and carrier comparison
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iperf3 ethtool iptables strace
          sudo env GITHUB_ACTIONS=true python3 scripts/smoke_echo_filter.py
          strace -f -qq -e trace=sendmmsg -o transport-artifacts/udp-burst-syscalls.log /tmp/ggs-carrier.test -test.run '^TestUDPQueuedBurstKeepsDatagramBoundaries$' -test.v
          python3 scripts/verify_batch_syscalls.py transport-artifacts/udp-burst-syscalls.log
          sudo env GITHUB_ACTIONS=true GGS_TRANSPORT_FOCUS="${{ github.ref == 'refs/heads/feature/compact-wire' && contains(github.event.head_commit.message, '[startup-focus]') && 'startup-recovery' || github.ref == 'refs/heads/feature/compact-wire' && contains(github.event.head_commit.message, '[compact-focus]') && 'compact-recovery' || '' }}" python3 scripts/transport_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-validation-${{ matrix.runner }}
          path: |
            transport-artifacts/
            extended-results/
  captured-control-path:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build exact source and check diagnostic harness
        run: |
          python3 -m py_compile scripts/control_path_validation.py
          python3 scripts/check_version.py
          bash scripts/build-release.sh
          sudo apt-get update -qq
          sudo apt-get install -y iperf3 ethtool iptables
      - name: Captured ICMP control path and one-way UDP validation
        run: sudo env GITHUB_ACTIONS=true python3 scripts/control_path_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-validation-control-${{ matrix.runner }}
          path: extended-results/
