name: Prepare source formatting only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: |
          mkdir -p formatting
          gofmt -w cmd internal
          git diff --binary -- cmd internal > formatting/gofmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: source-formatting
          path: formatting/gofmt.patch