name: RC5 focused security and loss validation
on:
  push:
    branches: [feature/rc5-session-recovery]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rc5-focus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        mode: [lifecycle, loss]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Verify narrowly scoped manager-only branch update
        if: github.ref == 'refs/heads/feature/rc5-session-recovery' && contains(github.event.head_commit.message, '[manager-only]')
        run: |
          python3 - <<'PY'
          import subprocess
          allowed={'scripts/manage.py','scripts/test_transport_change.py','docs/rc5-upgrade.md','.github/workflows/rc5-focus.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          if not changed or not changed<=allowed:raise SystemExit('Manager-only label includes unrelated source changes')
          print('Only manager/docs changed; prior native observations are retained. Tags always rerun every gate.')
          PY
      - name: Review format, static checks and race regressions
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          python3 -m py_compile scripts/manage.py scripts/rc5_focus.py scripts/render_release_notes.py
          python3 scripts/check_version.py
          go test -race -tags audit -short -count=1 -timeout 5m ./...
          go test -race ./internal/carrier ./internal/frame ./internal/engine -run '^Test(AuthenticatedChallenge|BoundOpaque|Delivery|Recovery)' -count=5 -timeout 4m -v
          bash scripts/build-release.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Native focused lifecycle or sustained-loss A/B
        if: github.ref != 'refs/heads/feature/rc5-session-recovery' || !contains(github.event.head_commit.message, '[manager-only]')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iperf3 ethtool iptables
          sudo env GITHUB_ACTIONS=true python3 scripts/rc5_focus.py '${{ matrix.mode }}'
      - name: Established-flow reordering and capacity-step regression
        if: matrix.mode == 'loss' && (github.ref != 'refs/heads/feature/rc5-session-recovery' || !contains(github.event.head_commit.message, '[manager-only]'))
        run: sudo env GITHUB_ACTIONS=true python3 scripts/delivery_focus.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc5-focus-${{ matrix.runner }}-${{ matrix.mode }}
          path: extended-results/
