name: rc5 development preflight
on:
  push:
    branches: [release/rc5]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Format in cloud and retain the exact source patch
        shell: bash
        run: |
          mkdir -p artifacts
          gofmt -w cmd internal
          git diff --binary -- cmd internal > artifacts/gofmt.patch
          python3 -m py_compile scripts/*.py
          bash -n setup.sh install.sh scripts/build-release.sh
      - name: Static, race and audit checks
        run: |
          go vet ./...
          go test -race -tags audit -short -count=1 -timeout 5m ./...
      - name: Measure owned frame buffers against previous copies
        run: go test ./internal/frame -run '^$' -bench 'BenchmarkCodecSealBuffers' -benchmem -benchtime 2s -count 3
      - name: Repeat filtered-path transition with silence suspension
        run: go test -race ./internal/carrier -run '^TestAdaptiveDelayedLinkAndPathTransition$' -count=50 -timeout 3m -v
      - name: Build and test every manager path
        run: |
          bash scripts/build-release.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc5-preflight-format
          path: artifacts/gofmt.patch
