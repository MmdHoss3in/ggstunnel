name: Linux validation and release
on:
  push:
    branches: [main, release/rc5]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended-validation:
    if: github.ref != 'refs/heads/release/rc5' || contains(github.event.head_commit.message, '[cloud-matrix]')
    uses: ./.github/workflows/extended.yml
  validate:
    if: github.ref != 'refs/heads/release/rc5' || contains(github.event.head_commit.message, '[cloud-matrix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Format and static checks
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          bash -n setup.sh install.sh scripts/build-release.sh
          python3 scripts/check_version.py
      - name: Race and audit tests
        run: go test -race -tags audit -short -count=1 -timeout 5m ./...
      - name: Fuzz authenticated wire parsers and tuner
        run: |
          go test ./internal/carrier -run '^$' -fuzz '^FuzzBIPWireParser$' -fuzztime 10s
          go test ./internal/carrier -run '^$' -fuzz '^FuzzTunerEventBounds$' -fuzztime 10s
          go test ./internal/frame -run '^$' -fuzz '^FuzzFrameParser$' -fuzztime 10s
      - name: Build release binaries
        run: bash scripts/build-release.sh
      - name: Manager and installer tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Privileged kernel and raw socket tests
        run: |
          go test -c -o /tmp/ggs-carrier.test ./internal/carrier
          go test -c -o /tmp/ggs-tun.test ./internal/tun
          sudo /tmp/ggs-carrier.test -test.run '^TestBIPRawLoopback$' -test.v
          sudo env GGS_KERNEL_TEST=1 /tmp/ggs-tun.test -test.run '^TestKernelTUNReadCancellation$' -test.v
      - name: Sustained and concurrent simulated links
        run: go test ./internal/carrier -run 'TestBIP5SustainedSimulation|TestNineBIP5Peers' -count=1 -timeout 4m -v
      - name: Real TUN throughput under delay and loss
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iperf3 ethtool
          mkdir -p artifacts
          sudo env GITHUB_ACTIONS=true GGS_RESULTS="$PWD/artifacts/network-results.jsonl" GGS_RECOVERY_RESULTS="$PWD/artifacts/recovery-results.jsonl" python3 scripts/test_netns.py
          for profile in tcp udp icmp gre; do
            sudo env GITHUB_ACTIONS=true GGS_TEST_PROFILE="$profile" GGS_RESULTS="$PWD/artifacts/network-results.jsonl" python3 scripts/test_netns.py
          done
      - name: Package verified source and binaries
        run: |
          bash scripts/build-release.sh
          mkdir -p artifacts
          tar --exclude='./.git' --exclude='./.github' --exclude='./artifacts' --exclude='./extended-results' --exclude='__pycache__' --transform='s,^\.,ggstunnel,' -czf artifacts/ggstunnel-linux.tar.gz .
          cd artifacts
          sha256sum ggstunnel-linux.tar.gz > SHA256SUMS
      - name: Verify and install the actual release archive
        run: |
          WORK=$(mktemp -d)
          tar -xzf artifacts/ggstunnel-linux.tar.gz -C "$WORK"
          (cd "$WORK/ggstunnel" && sha256sum --check SHA256SUMS)
          printf '0\n' | sudo bash "$WORK/ggstunnel/setup.sh" install
          sudo env GITHUB_ACTIONS=true python3 "$WORK/ggstunnel/scripts/smoke_systemd.py"
          printf '0\n' | sudo /usr/local/bin/ggstunnel
      - uses: actions/upload-artifact@v4
        with:
          name: ggstunnel-linux
          path: artifacts/
  platform-smoke:
    if: github.ref != 'refs/heads/release/rc5' || contains(github.event.head_commit.message, '[cloud-matrix]')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Native platform race and audit tests
        run: go test -race -tags audit -short -count=1 -timeout 5m ./...
      - name: Build package and exercise real systemd
        run: |
          bash scripts/build-release.sh
          sudo env GITHUB_ACTIONS=true python3 scripts/smoke_systemd.py
          printf '0\n' | sudo /usr/local/bin/ggstunnel
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, platform-smoke, extended-validation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ggstunnel-linux
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: extended-final-report
          path: artifacts
      - name: Publish tested version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat internal/version/VERSION)"
          python3 scripts/render_release_notes.py
          flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/ggstunnel-linux.tar.gz artifacts/SHA256SUMS artifacts/network-results.jsonl artifacts/recovery-results.jsonl artifacts/extended-summary.json artifacts/extended-report.md --verify-tag "${flags[@]}" --title "ggstunnel $GITHUB_REF_NAME" --notes-file artifacts/release-notes.md
