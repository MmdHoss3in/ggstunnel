name: Field stall recovery and seven-tunnel upgrade
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  recovery-upgrade:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Review and repeat field failure regressions
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./internal/carrier -run '^TestFieldStall' -count=5 -timeout 3m -v
          bash scripts/build-release.sh
          python3 -m unittest scripts/test_field_upgrade.py -v
          python3 -m py_compile scripts/field_stall_validation.py
          sudo apt-get update -qq
          sudo apt-get install -y iperf3 ethtool iptables
      - name: Published 0.3.6 mixed peers and real seven-service upgrade rollback
        run: sudo env GITHUB_ACTIONS=true python3 scripts/field_stall_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-stall-${{ matrix.runner }}
          path: extended-results/
