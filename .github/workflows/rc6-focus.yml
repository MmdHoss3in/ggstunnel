name: RC6 stability validation
on:
  push:
    branches: [feature/rc6-stability]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rc6-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stability:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        mode: [renewal, path, performance]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Static review, audit and races
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          bash -n setup.sh install.sh scripts/build-release.sh
          python3 scripts/check_version.py
          go test -race -tags audit -short -count=1 -timeout 5m ./...
          go test -race ./internal/engine ./internal/carrier ./internal/pathmtu -run '^Test(PersistentDevice|FairQueueExpir|PathProbe|PathReply|ProbeCorrelation|Recovery)' -count=10 -timeout 3m
          bash scripts/build-release.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Native prescribed experiment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iperf3 ethtool iptables
          sudo env GITHUB_ACTIONS=true python3 scripts/rc6_focus.py '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-${{ matrix.mode }}-${{ matrix.runner }}
          path: extended-results/
          if-no-files-found: warn
